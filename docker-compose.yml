services:
  api:
    build: .
    container_name: taskhub-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app     # Mount source code → sửa code không cần rebuild
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env

  db:
    image: mysql:8
    container_name: taskhub-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskhub
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskhub-redis
    ports:
      - "6379:6379"

volumes:
  db_data: